name: Run Sniper Solana Bot

on:
  workflow_dispatch:

jobs:
  run-sniper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Ejecutar sniper en OBSERVACIÓN
        run: npm start

      - name: Guardar registro de oportunidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities-log
          path: opportunities.jsonl
          if-no-files-found: warn